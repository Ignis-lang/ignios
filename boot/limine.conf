# Limine configuration, copied to /EFI/BOOT/limine.conf in the boot image
# (see the `esp` target of the Makefile). Limine reads it from the volume it
# was started from.

# Seconds before the default entry boots. 0 boots at once, without a menu.
timeout: 0

# One boot entry. A line that starts without indentation and with `/` opens
# an entry, and the indented keys below it belong to it.
/IgniOS
    # The Limine boot protocol, which kernel/src/limine.ign speaks.
    protocol: limine

    # The kernel ELF. `boot():` is the volume Limine booted from.
    path: boot():/kernel.elf

    # The only module, the initramfs: a ustar archive of build/initramfs/ (see
    # the Makefile). The kernel gets its address and size in the module
    # response (kernel/src/mm/modules.ign), finds it by `module_string` and
    # builds its file tree from it (kernel/src/fs/vfs.ign). The user programs
    # are in it, under /bin.
    module_path: boot():/initramfs.tar
    module_string: initramfs
