# Ignis project file of the `threadtest` user program, built from user/threadtest by the
# Makefile and linked with user/user.ld.
[package]
name = "threadtest"
version = "0.1.0"
description = "Ring 3 checks of threads, futexes and memory shared between them"

# The standard library is the small user library in user/lib (sys and io),
# not the Ignis one.
[ignis]
std = false
std_path = "../lib/linux"

[build]
bin = false
source_dir = "src"
entry = "main.ign"
out_dir = "../../build/user/threadtest"
opt_level = 2
debug = false
target = "c"
cc = "clang"

# Like the kernel's flags without the kernel code model (the program is linked
# at 0x400000), without -mno-red-zone (interrupts from ring 3 switch to the
# kernel stack, so the red zone below rsp is safe) and without -mno-sse and
# friends: the kernel saves and restores the x87 and SSE registers of every
# thread on each switch (kernel/src/arch/x86_64/fpu.ign). AVX stays off, the
# x86-64 baseline target does not enable it, because the kernel saves only the
# FXSAVE state.
cflags = [
  "--target=x86_64-unknown-none",
  "-fno-pic",
  "-fno-pie",
  "-fno-stack-protector",
  "-fno-omit-frame-pointer",
]
emit = ["c"]
