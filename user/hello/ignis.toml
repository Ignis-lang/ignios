[package]
name = "hello"
version = "0.1.0"
description = "The first IgniOS user program"

[ignis]
std = false
std_path = "../lib"

[build]
bin = false
source_dir = "src"
entry = "main.ign"
out_dir = "../../build/user/hello"
opt_level = 2
debug = false
target = "c"
cc = "clang"
cflags = [
  "--target=x86_64-unknown-none",
  "-mno-sse",
  "-mno-sse2",
  "-mno-mmx",
  "-mno-80387",
  "-fno-pic",
  "-fno-pie",
  "-fno-stack-protector",
  "-fno-omit-frame-pointer",
]
emit = ["c"]
