# The Linux flavour of the IgniOS user standard library. A program that
# names it with `std_path = "../lib/linux"` speaks the Linux x86_64 system
# call ABI and is linked after this directory's `start.S`.
#
# `sys` is this flavour's own; `io`, `args` and `alloc` are shared with the
# native flavour (../native) and reach the kernel only through `std::sys`,
# which each flavour resolves to its own `sys.ign`.

# Import name to source file: `import Sys from "std::sys"` reads sys.ign.
[modules]
sys = "sys.ign"
io = "../common/io.ign"
args = "../common/args.ign"
alloc = "../common/alloc.ign"

# Modules loaded implicitly into every program: none. A program imports what
# it uses.
[auto_load]
modules = []
